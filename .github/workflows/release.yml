name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          # Intel macOS is cross-compiled from the arm runner: the macos-13
          # (last Intel) runner label is retired and queues forever.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        # Archive layout is target/release/herdr-window-title so that
        # extracting at the plugin root restores the path the plugin
        # manifest's commands expect.
        run: |
          archive="herdr-window-title-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          mkdir -p stage/target/release
          cp "target/${{ matrix.target }}/release/herdr-window-title" stage/target/release/
          tar -C stage -czf "$archive" target/release/herdr-window-title
          echo "packaged $archive"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: herdr-window-title-*.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum herdr-window-title-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            dist/herdr-window-title-*.tar.gz dist/SHA256SUMS
